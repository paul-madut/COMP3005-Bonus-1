[project]
name = "ra-engine"
version = "0.1.0"
description = "A relational algebra engine built from a hand-written grammar"
requires-python = ">=3.12"
# The engine itself uses the standard library only.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
# Plotting is allowed for the report only.
report = ["matplotlib>=3.9"]

[tool.uv]
default-groups = ["dev", "report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "bench"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["relalg", "ra.py", "bench", "tests"]

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true
